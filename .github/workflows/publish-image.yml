name: Publish Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Check out the relay source before building the runtime image.
      - uses: actions/checkout@v4

      # Buildx provides a stable digest for infrastructure pinning.
      - uses: docker/setup-buildx-action@v3

      # Publish the image to the rrainn GHCR namespace.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Use short-SHA image tags so deployed containers map back to Git.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rrainn/nostr-relay
          tags: |
            type=sha,prefix=sha-,format=short

      # Build and publish the production relay image.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Print the immutable image reference used by infrastructure.
      - name: Print immutable image reference
        run: echo "ghcr.io/rrainn/nostr-relay@${{ steps.build.outputs.digest }}"
